    <circle cx="129.5" cy="35" r="5" fill="#C9A868"/>
    <rect x="1060" y="112" width="22" height="248" rx="3" fill="#EFE4D0"/>
    <rect x="1052" y="212" width="38" height="12" rx="2" fill="#E2D3B3"/>
    <rect x="1055" y="86" width="32" height="28" rx="4" fill="#F3EADA"/>
    <path d="M1071 86c-18 0-22-16-22-16 11 3 14-6 14-6 4 11 8 8 8 8 0 0 6 3 0 14Z" fill="#8C9A7E"/>
    <rect x="1067.5" y="40" width="7" height="48" rx="3.5" fill="#B08A4A"/>
    <circle cx="1071" cy="35" r="5" fill="#C9A868"/>
  </g>

  <!-- Mosque body -->
  <rect x="230" y="216" width="740" height="144" fill="#F7F0E3"/>
  <rect x="230" y="216" width="740" height="10" fill="#E6D9BC"/>
  <rect x="230" y="348" width="740" height="12" fill="#E6D9BC"/>

