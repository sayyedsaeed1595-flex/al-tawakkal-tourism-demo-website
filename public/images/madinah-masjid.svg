      <stop offset="0" stop-color="#FCF8F1"/>
      <stop offset="1" stop-color="#F5EDDE"/>
    </linearGradient>
    <linearGradient id="mdDome" x1="600" y1="120" x2="600" y2="228" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#96A187"/>
      <stop offset="1" stop-color="#6F7C63"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="420" fill="url(#mdSky)"/>

  <!-- Minarets -->
  <g>
    <rect x="118" y="112" width="22" height="248" rx="3" fill="#EFE4D0"/>
    <rect x="110" y="212" width="38" height="12" rx="2" fill="#E2D3B3"/>
    <rect x="113" y="86" width="32" height="28" rx="4" fill="#F3EADA"/>
